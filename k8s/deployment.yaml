apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app-deployment
  labels:
    app: devops-app
spec:
  replicas: 2 # Запускаем 2 одинаковых пода для отказоустойчивости
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
      - name: devops-app
        image: grin96/my-devops-app:latest # Твой образ из Docker Hub
        imagePullPolicy: Always
        ports:
        - containerPort: 8000