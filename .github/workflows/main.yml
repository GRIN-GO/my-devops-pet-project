name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-devops-app:${{ github.sha }} .

      - name: Test Container Run
        run: |
          docker run -d -p 8000:8000 --name test-app my-devops-app:${{ github.sha }}
          sleep 3
          curl http://localhost:8000/health